<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 할 일</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#202a40;font:16px system-ui,sans-serif}main{max-width:680px;margin:70px auto;padding:30px;background:white;border-radius:24px;box-shadow:0 12px 50px #2533560d}header small{color:#626f87}h1{font-size:32px;margin:10px 0}p{color:#69758c}form{display:flex;gap:10px;margin:28px 0 22px}input[type=text]{flex:1;min-width:0;border:1px solid #ccd3e0;border-radius:12px;padding:14px;font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font:inherit;background:#edf0f7;color:#43516b}form button{background:#4f46e5;color:white}nav{display:flex;gap:8px}nav button[aria-pressed=true]{background:#e9e7ff;color:#463cc4}ul{padding:0;list-style:none;margin:20px 0}li{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #edf0f5}li label{display:flex;align-items:center;gap:12px;flex:1;overflow-wrap:anywhere}input[type=checkbox]{width:20px;height:20px;flex-shrink:0;accent-color:#4f46e5}li.done span{text-decoration:line-through;color:#8b94a6}li button{background:transparent;font-size:14px;color:#9b4050}#empty{text-align:center;padding:36px 0}#error{color:#b42318}footer{font-size:13px;color:#7b8598}button:focus-visible,input:focus-visible{outline:3px solid #aca7ff;outline-offset:3px}@media(max-width:720px){main{margin:24px 16px;padding:24px}h1{font-size:28px}}
</style>
<main><header><small>작은 실천, 가벼운 하루</small><h1>오늘의 할 일</h1><p id="summary" aria-live="polite">목록을 불러오는 중…</p></header>
<form id="add"><input id="title" type="text" maxlength="200" placeholder="어떤 일을 해볼까요?" aria-label="새 할 일" required autocomplete="off"><button>추가</button></form>
<nav aria-label="할 일 필터"><button data-filter="all" aria-pressed="true">전체</button><button data-filter="active" aria-pressed="false">진행 중</button><button data-filter="done" aria-pressed="false">완료</button></nav>
<p id="error" role="alert" hidden></p><ul id="list"></ul><p id="empty" hidden>아직 할 일이 없어요. 첫 할 일을 추가해보세요.</p><footer>목록은 자동으로 저장됩니다.</footer></main>
<script>
let todos=[],filter='all';
const $=id=>document.getElementById(id);
async function request(path,method='GET',body){const response=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||'요청에 실패했습니다.');return data;}
async function run(action){$('error').hidden=true;try{await action();}catch(error){$('error').textContent=error.message;$('error').hidden=false;}}
async function refresh(){todos=await request('/api/todos');render();}
function render(){const completed=todos.filter(t=>t.completed).length;$('summary').textContent=`전체 ${todos.length}개 · 완료 ${completed}개 · 남은 일 ${todos.length-completed}개`;$('list').replaceChildren();const visible=todos.filter(t=>filter==='all'||(filter==='done'?t.completed:!t.completed));$('empty').hidden=visible.length>0;$('empty').textContent=todos.length?'이 상태의 할 일이 없어요.':'아직 할 일이 없어요. 첫 할 일을 추가해보세요.';for(const todo of visible){const li=document.createElement('li');li.classList.toggle('done',!!todo.completed);const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=!!todo.completed;check.setAttribute('aria-label',`${todo.title} 완료 상태`);check.onchange=()=>run(async()=>{try{await request(`/api/todos/${todo.id}`,'PATCH',{completed:check.checked});await refresh();}catch(e){check.checked=!!todo.completed;throw e;}});const title=document.createElement('span');title.textContent=todo.title;label.append(check,title);const remove=document.createElement('button');remove.textContent='삭제';remove.setAttribute('aria-label',`${todo.title} 삭제`);remove.onclick=()=>run(async()=>{await request(`/api/todos/${todo.id}`,'DELETE',{});await refresh();});li.append(label,remove);$('list').append(li);}}
$('add').onsubmit=event=>{event.preventDefault();const title=$('title').value.trim();if(!title)return;const button=event.submitter;button.disabled=true;run(async()=>{try{await request('/api/todos','POST',{title});$('title').value='';await refresh();$('title').focus();}finally{button.disabled=false;}});};
document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();});
run(refresh);
</script>
</html>
